# temporal-proxy configuration — Temporal Cloud upstream scenario.
#
# Deliberately a decal of local.yaml: `diff proxy/local.yaml
# proxy/cloud.yaml` shows the upstream and little else. Moving the whole
# demo from the dev server to Temporal Cloud is exactly that diff — no Go
# code touched, no image rebuilt. The application still dials
# temporal-proxy in plaintext, still calls its Namespace `default`, and
# still carries no TLS material and no credentials. Everything Cloud
# requires is added below, out of the application's sight.
#
# temporal-proxy proves who it is with a client certificate: `cert` and
# `key` are the pair it presents on the handshake, at fixed container
# paths fed by a read-only mount.
#
# `$VAR` and `${VAR}` are expanded from the proxy process's own
# environment. Compose passes the two TEMPORAL_* values in from .env.
#
# Bind 0.0.0.0 rather than 127.0.0.1 so temporal-proxy is reachable from
# the host and from other containers on the Compose network.
hostPort: 0.0.0.0:7233

routing:
  default: cloud   # Namespaced requests
  system: cloud    # Namespace-less requests, e.g. GetSystemInfo on connect

# One upstream serves both routes because its host is a fixed string. The
# upstream project's `cloud` example splits `system` into a second upstream
# only because it templates the host with `{{ .RemoteNamespace }}`, and a
# Namespace-less call has nothing to render that template from.
upstreams:
  - name: cloud
    hostPort: ${TEMPORAL_CLOUD_NAMESPACE}.${TEMPORAL_ACCOUNT}.tmprl.cloud:7233
    # Three fields, two directions: `ca` is the trust anchor
    # temporal-proxy checks the upstream's own certificate against,
    # while `cert` and `key` are what it presents to prove who it is.
    #
    # A `ca` is required whenever a client certificate is set, and it
    # replaces the default roots rather than extending them — so it
    # points at the image's public bundle, which carries the root behind
    # Cloud's server certificate, and never at the CA that signed `cert`.
    tls:
      ca: /etc/ssl/certs/ca-certificates.crt
      cert: /etc/proxy/certs/client.pem
      key: /etc/proxy/certs/client.key
    namespaces:
      rules:
        # The application asks for `default`; Cloud knows the Namespace by
        # its fully-qualified name. The override rewrites the name on the
        # way out and restores the short one on the way back, so the short
        # name is the only one the application ever sees.
        overrides:
          - local: default
            remote: ${TEMPORAL_CLOUD_NAMESPACE}.${TEMPORAL_ACCOUNT}
