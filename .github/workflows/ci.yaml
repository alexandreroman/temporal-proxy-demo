# The repository's quality gate, on every push and pull request to main.
#
# `make check` is the single entry point on purpose: CI runs the very command a
# developer runs locally, so the two can never drift apart.
#
# The container image and the cluster stay out of it. The image exists to be
# loaded into the local Kind cluster by `make image`, and standing that cluster
# up needs Temporal Cloud credentials and a client certificate CI does not
# have.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing is published, so reading the repository is all this workflow needs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from go.mod, so a Go upgrade lands in one place.
      # setup-go caches the module and build caches from go.sum on its own.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
