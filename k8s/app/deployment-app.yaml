# The HTTP API: POST /hello starts one Workflow Execution, and the
# demo page it serves drives that same endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # cmd/app never calls the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: app
          # Built by `make image` and loaded straight into the cluster's
          # nodes, so there is no registry and nothing to pull.
          image: temporal-proxy-demo:dev
          command: ["/app/app"]
          env:
            # A local endpoint, in plaintext, with the application's
            # own short Namespace name. No TLS material, no credential,
            # no fully-qualified Namespace: everything the upstream
            # needs lives elsewhere.
            - name: TEMPORAL_ADDRESS
              value: temporal-proxy.temporal-proxy:7233
            - name: TEMPORAL_NAMESPACE
              value: demo
          ports:
            - name: http
              containerPort: 8080
          # The API connects to Temporal before it listens, so a bound
          # listener is the real "can serve" signal.
          readinessProbe:
            tcpSocket:
              port: http
          # One replica behind the cluster's only route: the default rollout
          # already starts the replacement before touching this pod, and
          # this sleep keeps the outgoing pod answering while Traefik still
          # holds its address. Without it, Traefik answers 504.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
