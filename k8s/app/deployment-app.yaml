# The HTTP API: POST /hello starts one Workflow Execution, and the
# demo page it serves drives that same endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  selector:
    matchLabels:
      app: app
  # One replica behind the cluster's only route, so a rollout has to
  # overlap: the replacement is Ready, and in the EndpointSlice,
  # before the outgoing pod is touched, and the outgoing pod outlives
  # Traefik's view of it (see preStop below). Without both, Traefik
  # keeps sending to an address that has gone, and answers 504.
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          # Built by `make image` and loaded straight into the cluster's
          # nodes, so there is no registry and nothing to pull.
          image: temporal-proxy-demo:dev
          command: ["/app/app"]
          env:
            # A local endpoint, in plaintext, with the application's
            # own short Namespace name. No TLS material, no credential,
            # no fully-qualified Namespace: everything the upstream
            # needs lives elsewhere.
            - name: TEMPORAL_ADDRESS
              value: temporal-proxy.temporal-proxy:7233
            - name: TEMPORAL_NAMESPACE
              value: demo
            # A display label for the page, which draws where Workflow
            # Executions land. The application cannot observe which
            # upstream serves its endpoint, so the deployment names it:
            # the Go code renders the string and interprets nothing.
            # `cloud` and `local` are the two destinations the page can
            # light up, and an empty value lights neither.
            - name: TEMPORAL_TARGET
              value: cloud
          ports:
            - name: http
              containerPort: 8080
          # The API connects to Temporal before it listens, so a bound
          # listener is the real "can serve" signal.
          readinessProbe:
            tcpSocket:
              port: http
          # The second half of the overlap described above.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
