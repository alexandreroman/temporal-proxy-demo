# Traefik is the cluster's only ingress controller, and its web
# entrypoint is the only thing this cluster publishes.

# NodePort, so the Kind port mapping on the worker node reaches it.
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  # Only the web entrypoint is published, so websecure is kept off the
  # Service: exposed, it would take a second, random node port that
  # nothing reaches.
  websecure:
    expose:
      default: false

providers:
  kubernetesGateway:
    # Off by default; this is how this repository's HTTPRoutes reach Traefik.
    enabled: true

# The chart's default Gateway restricts routes to its own namespace, and
# every workload here lives in another one. Only HTTPRoute is needed, so
# the chart's Gateway is kept rather than replaced.
gateway:
  # Every HTTPRoute in this repository names this Gateway in its
  # `parentRefs`, so the name is pinned here rather than left to the chart's
  # default: a chart default is not a contract, and it can change between
  # chart versions with nothing in this repository noticing.
  name: traefik-gateway
  listeners:
    web:
      namespacePolicy:
        from: All

# The demo makes no outbound calls of its own; checkNewVersion is the one
# Traefik default that would make one, so it is turned off here.
global:
  checkNewVersion: false
