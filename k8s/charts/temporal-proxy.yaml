# temporal-proxy is the only workload that knows where Temporal is. These
# values feed its upstream chart, and `config:` below is temporal-proxy's own
# configuration file, copied into a ConfigMap without Helm's templating: each
# ${VAR} survives, and temporal-proxy expands it from its environment at
# startup, which keeps this file committable and account-agnostic.

# The chart would otherwise default to its own appVersion, which
# trails the image releases.
image:
  tag: v1.1.1

# Also becomes the gateway's listen address, since the chart derives
# config.hostPort from this port.
service:
  port: 7233

# temporal-proxy never calls the Kubernetes API.
serviceAccount:
  automount: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# temporal-proxy registers the standard gRPC health service under the
# empty service name, which is what a bare grpc probe asks for: a
# stronger check than the chart's default TCP probe, which only sees
# the listener accept a connection. Helm merges maps, so
# `tcpSocket: null` is what deletes that default — left in place, the
# probe would carry two handlers and the API server would reject it.
livenessProbe:
  tcpSocket: null
  grpc:
    port: 7233
readinessProbe:
  tcpSocket: null
  grpc:
    port: 7233

# The variables the configuration references as ${VAR}, which the binary
# expands from this environment at startup: the Namespace and account
# identifiers, which `make apply` builds from .env, and the KMS server's
# bearer token, generated in the cluster. Each Secret holds only what this
# container needs, so the neighbouring kms-master-secret never reaches it.
envFrom:
  - secretRef:
      name: temporal-cloud-config
  - secretRef:
      name: kms-api-key

# One key of the Secret, so the KMS server's private key never reaches this
# container — only its self-signed certificate, which is what the extension
# server's tls.ca is set to below.
volumes:
  - name: kms-ca
    secret:
      secretName: kms-tls
      items:
        - key: ca.crt
          path: ca.crt

volumeMounts:
  - name: kms-ca
    mountPath: /etc/temporal-proxy/certs/kms

config:
  routing:
    # This one key selects the upstream: write `selfhosted` in place of
    # `cloud`, run `make apply`, and nothing else moves. `system`, which
    # would take the Namespace-less requests on its own, is omitted, so
    # those follow `default` too.
    default: cloud
  upstreams:
    - name: cloud
      # The Namespace endpoint takes an API key only on a Namespace whose sole
      # auth method is API keys. The regional endpoint is no substitute: the
      # Web UI sends no `temporal-namespace` header.
      hostPort: ${TEMPORAL_CLOUD_NAMESPACE}.${TEMPORAL_ACCOUNT}.tmprl.cloud:7233
      # No `tls` block: Cloud's certificate is publicly signed, and the API key
      # is the whole of the authentication.
      credentials:
        static:
          # The chart turns this reference into an environment variable on
          # the container, and writes `${TP_UPSTREAM_CLOUD_API_KEY}` here in
          # the rendered config, so the key never lands in the ConfigMap.
          # `make apply` builds the Secret from .env. The same key also
          # authorizes Cloud's control plane, which answers the calls a
          # Namespace endpoint does not — the Web UI's ListNamespaces and
          # ListSearchAttributes among them — so temporal-proxy reuses it
          # there with nothing more to configure.
          apiKey:
            secretKeyRef:
              name: temporal-cloud-api-key
              key: TEMPORAL_CLOUD_API_KEY
      namespaces:
        rules:
          # One temporal-proxy fronts several applications, so a short
          # name has to say which one is asking: this demo owns `demo`,
          # not `default`. Cloud knows that Namespace by its
          # fully-qualified name, and the override rewrites it on the
          # way out and restores the short name on the way back.
          overrides:
            - local: demo
              remote: ${TEMPORAL_CLOUD_NAMESPACE}.${TEMPORAL_ACCOUNT}

    # `insecure: true` is how plaintext inside the cluster is stated rather
    # than implied: an upstream that says nothing about its transport is
    # dialled over TLS and verified against the system roots, which this
    # frontend does not answer. It stands in place of a `tls` block rather
    # than beside one — the two are mutually exclusive, and setting both is a
    # validation error. No `namespaces.rules` either, because the Service
    # registers the Namespace under `demo`, the very name the application
    # asks for — the local name and the remote name are the same string, so
    # there is nothing to rewrite. The Cloud upstream above needs both.
    - name: selfhosted
      hostPort: temporal.temporal:7233
      insecure: true

  # The key management backend. temporal-proxy connects to every extension
  # server at startup, so an unreadable ca file, or a KMS server it cannot
  # reach, fails startup rather than the first payload. The chart wires tls
  # and credentials for the gateway and for upstreams only, never for an
  # extension server, so both are supplied by hand below.
  extensionServers:
    - name: kms
      hostPort: kms.temporal-proxy:9443
      tls:
        ca: /etc/temporal-proxy/certs/kms/ca.crt
      credentials:
        static:
          apiKey: ${KMS_API_KEY}

  # Envelope encryption. Each data encryption key is wrapped by the key
  # addressed here: "kms" names the server above, and the whole URI is the
  # key's identity, recorded with each wrapped data key so the same key is
  # chosen to open it. The KMS server never sees the URI: it picks its own
  # key by Namespace.
  #
  # `enabled: false` stops sealing new payloads while leaving everything sealed
  # earlier readable, because the key below is what builds the vault and inbound
  # decryption is never gated. That makes this flag the whole of what turns
  # encryption off — deleting the block instead would take the vault with it
  # and leave the existing history unreadable.
  encryption:
    enabled: true
    # Required whenever keys are configured: temporal-proxy refuses to start
    # without it. Each sealed payload carries the Namespace it was sealed under
    # (its name on the upstream, after the override), authenticated with the
    # ciphertext. `strict` opens a payload only when that label matches the
    # request's Namespace, so a payload copied into another Namespace does not
    # open.
    namespaceBinding: strict
    default:
      uri: extension://kms/payloads
      # How long one Namespace's data key seals new payloads before a fresh
      # one takes over. Payloads it sealed stay readable.
      duration: 1h
