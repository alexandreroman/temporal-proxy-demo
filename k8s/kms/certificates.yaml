# The KMS server's certificate, issued in the cluster by a self-signed
# issuer. Its Secret's ca.crt is therefore the certificate itself, which is
# the file temporal-proxy verifies against.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kms-tls
spec:
  secretName: kms-tls
  # The name its caller dials, so no serverName override is needed anywhere.
  dnsNames:
    - kms.temporal-proxy
  issuerRef:
    name: selfsigned
