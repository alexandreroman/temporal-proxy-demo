# The KMS server's certificate, issued in the cluster. A self-signed issuer signs
# one CA, and that CA signs the server certificate — the two-tier shape that fills
# ca.crt in the leaf's Secret, which is the file temporal-proxy verifies against.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kms-ca
spec:
  isCA: true
  commonName: kms-ca
  secretName: kms-ca
  issuerRef:
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kms-ca
spec:
  ca:
    secretName: kms-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kms-tls
spec:
  secretName: kms-tls
  # The name its caller dials, so no serverName override is needed anywhere.
  dnsNames:
    - kms.temporal-proxy
  issuerRef:
    name: kms-ca
