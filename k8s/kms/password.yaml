# The bearer token the KMS server accepts and temporal-proxy presents,
# generated in the cluster so it appears in no file anyone has to write.
# secretgen-controller creates the Secret only when it is absent, so the
# token never rotates underneath a running pod. Length and character set
# are left at their defaults: forty alphanumeric characters, which is
# what an authorization header wants.
apiVersion: secretgen.k14s.io/v1alpha1
kind: Password
metadata:
  name: kms-api-key
spec:
  secretTemplate:
    type: Opaque
    stringData:
      KMS_API_KEY: $(value)
