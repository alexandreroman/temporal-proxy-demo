# The extension server: it wraps and unwraps data encryption keys, and
# never sees a payload. It reads its two secrets from the environment
# and its certificate from the Secret cert-manager fills.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kms
spec:
  selector:
    matchLabels:
      app: kms
  template:
    metadata:
      labels:
        app: kms
    spec:
      # cmd/kms never calls the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: kms
          image: temporal-proxy-demo:dev
          command: ["/app/kms"]
          envFrom:
            - secretRef:
                name: kms-api-key
            - secretRef:
                name: kms-master-secret
          volumeMounts:
            - name: tls
              mountPath: /etc/kms
              readOnly: true
          # The TLS listener binds only once cert-manager's Secret is read,
          # so a bound socket is the real "can serve" signal — not a grpc
          # probe, since the kubelet's prober dials in plaintext and this
          # port only speaks TLS.
          readinessProbe:
            tcpSocket:
              port: 9443
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tls
          secret:
            secretName: kms-tls
