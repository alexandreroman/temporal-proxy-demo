# temporal-proxy for the `credentials` scenario. One upstream, Temporal
# Cloud, reached with a client certificate that arrived from Vault.
#
# The chart's appVersion trails the release, and temporal-proxy is
# pre-release, so the image is pinned here rather than inherited.
image:
  tag: v0.5.2

# The chart derives the listener address from this when config.hostPort
# is unset, so one value sets both the Service and the bind address.
service:
  port: 7233

# The chart's defaults are httpGet probes on "/", which cannot succeed
# against a gRPC listener. Helm merges maps, so adding grpc alone would
# leave a probe with two handlers, which the API server rejects: the
# default has to be nulled out explicitly. temporal-proxy registers the
# standard gRPC health service under the empty service name, which is
# what a bare grpc probe asks for.
livenessProbe:
  httpGet: null
  grpc:
    port: 7233
readinessProbe:
  httpGet: null
  grpc:
    port: 7233

# The Namespace and account identifiers are not credentials, but they
# are account-specific, so they stay out of this committed file. `make`
# builds this Secret from .env.
envFrom:
  - secretRef:
      name: temporal-cloud-config

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# The chart does not run values through Helm's tpl, so ${VAR} reaches
# the ConfigMap intact and temporal-proxy expands it from its own
# environment at startup.
config:
  routing:
    default: cloud   # Namespaced requests
    system: cloud    # Namespace-less requests, e.g. GetSystemInfo on connect
  upstreams:
    - name: cloud
      hostPort: ${TEMPORAL_CLOUD_NAMESPACE}.${TEMPORAL_ACCOUNT}.tmprl.cloud:7233
      # secretName mounts the Secret and points cert and key at
      # tls.crt and tls.key under it. `ca` is set alongside on purpose:
      # a client certificate obliges one, and it verifies the upstream's
      # own certificate rather than the client's — so it is the public
      # bundle the image carries, never the CA that signed the client.
      tls:
        secretName: temporal-cloud-client
        ca: /etc/ssl/certs/ca-certificates.crt
      namespaces:
        rules:
          # The application asks for `default`; Cloud knows the Namespace
          # by its fully-qualified name. The override rewrites it on the
          # way out and restores the short name on the way back.
          overrides:
            - local: default
              remote: ${TEMPORAL_CLOUD_NAMESPACE}.${TEMPORAL_ACCOUNT}
