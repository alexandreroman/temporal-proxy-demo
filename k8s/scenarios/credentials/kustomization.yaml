# The `credentials` scenario: the Temporal Cloud client certificate
# reaches temporal-proxy from Vault, through a Kubernetes Secret. It
# adds nothing to the base today; it exists because a scenario is
# always an overlay plus one temporal-proxy values file, and the
# `encryption` scenario will add its components right here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
