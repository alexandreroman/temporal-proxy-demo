# The `credentials` scenario: temporal-proxy reaches Temporal Cloud
# with a client certificate mounted from a Kubernetes Secret.
#
# A scenario owns the configuration; the base owns the workload. The
# ConfigMap's name carries a hash of config.yaml, so editing the
# configuration rolls the pods with no restart command.
#
# `namespace` is load-bearing here for the same reason it is in
# k8s/base/proxy: a generated object carries no namespace unless it
# is set, and Kustomize rewrites a reference only within one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: temporal-proxy
    namespace: temporal-proxy
    files:
      - config.yaml
