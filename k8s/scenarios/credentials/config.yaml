# temporal-proxy for the `credentials` scenario: one upstream,
# Temporal Cloud, reached with a client certificate.
#
# ${VAR} references stay literal in this file and in the ConfigMap
# built from it. temporal-proxy expands them from its own
# environment at startup, which is what keeps this file committable
# and account-agnostic.
hostPort: :7233
routing:
  default: cloud   # Namespaced requests
  system: cloud    # Namespace-less requests, e.g. GetSystemInfo on connect
upstreams:
  - name: cloud
    hostPort: ${TEMPORAL_CLOUD_NAMESPACE}.${TEMPORAL_ACCOUNT}.tmprl.cloud:7233
    # `ca` is set alongside the client pair on purpose: a client
    # certificate obliges one, and it verifies the upstream's own
    # certificate rather than the client's — so it is the public
    # bundle the image carries, never the CA that signed the client.
    tls:
      cert: /etc/temporal-cloud/tls.crt
      key: /etc/temporal-cloud/tls.key
      ca: /etc/ssl/certs/ca-certificates.crt
    namespaces:
      rules:
        # The application asks for `default`; Cloud knows the
        # Namespace by its fully-qualified name. The override
        # rewrites it on the way out and restores the short name on
        # the way back.
        overrides:
          - local: default
            remote: ${TEMPORAL_CLOUD_NAMESPACE}.${TEMPORAL_ACCOUNT}
