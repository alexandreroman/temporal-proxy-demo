# Sends the host name of the Web UI that reads through temporal-proxy to it.
# k8s/app/httproute.yaml explains the `parentRefs` and the rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ui
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "temporal-webui.127-0-0-1.nip.io"
  rules:
    - backendRefs:
        - name: ui
          port: 8080
