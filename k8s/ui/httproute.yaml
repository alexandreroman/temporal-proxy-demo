# The third published host name: the Web UI that reads through temporal-proxy.
# It arrives on Traefik's port, like the other two.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ui
spec:
  parentRefs:
    # The Gateway `k8s/app/httproute.yaml` binds to as well: its name is
    # pinned by `gateway.name` in `k8s/charts/traefik.yaml`, and its listener
    # accepts routes from every namespace.
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "temporal-webui.127-0-0-1.nip.io"
  rules:
    # A rule with no `matches` matches every path, exactly as an explicit
    # PathPrefix `/` would.
    - backendRefs:
        - name: ui
          port: 8080
