# Sends the self-hosted Web UI's host name to it. k8s/app/httproute.yaml explains
# the `parentRefs` and the rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-ui
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "temporal.127-0-0-1.nip.io"
  rules:
    - backendRefs:
        - name: temporal
          port: 8233
