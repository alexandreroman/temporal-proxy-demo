# The second published host name: the self-hosted Web UI. Traefik's port is
# the single port this cluster publishes, and both host names arrive on it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-ui
spec:
  parentRefs:
    # The Gateway `k8s/app/httproute.yaml` binds to as well: its name is
    # pinned by `gateway.name` in `k8s/charts/traefik.yaml`, and its listener
    # accepts routes from every namespace.
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "temporal.127-0-0-1.nip.io"
  rules:
    # A rule with no `matches` matches every path, exactly as an explicit
    # PathPrefix `/` would.
    - backendRefs:
        - name: temporal
          port: 8233
