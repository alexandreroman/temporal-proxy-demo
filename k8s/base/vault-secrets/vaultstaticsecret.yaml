# Vault's KV entry becomes the Secret temporal-proxy mounts. The KV keys
# are already named tls.crt and tls.key, which is exactly what a
# kubernetes.io/tls Secret requires, so no transformation is configured.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: temporal-cloud-client
  namespace: temporal-proxy
spec:
  vaultAuthRef: vault
  mount: secret
  path: temporal-cloud
  type: kv-v2
  refreshAfter: 1h
  destination:
    name: temporal-cloud-client
    create: true
    type: kubernetes.io/tls
  # temporal-proxy reads its certificate once, at startup, so a rotation
  # in Vault only takes effect after the pod restarts. The operator
  # triggers that restart itself.
  rolloutRestartTargets:
    - kind: Deployment
      name: temporal-proxy
