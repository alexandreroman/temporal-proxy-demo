# What the Worker and the API dial: temporal-proxy.temporal-proxy:7233.
# No type is set, so this Service is reachable only from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: temporal-proxy
  namespace: temporal-proxy
spec:
  selector:
    app: temporal-proxy
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
