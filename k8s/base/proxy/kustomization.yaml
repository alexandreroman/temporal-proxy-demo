# The client certificate becomes a Secret whose name carries a hash
# of the certificate's content, so replacing the file changes the
# name, the Deployment's reference follows, and the pods roll.
#
# `namespace` is load-bearing: Kustomize rewrites a reference only
# when the referring object and the generated object share a
# namespace, and a generated object has none unless it is set here.
# Without it the Deployment would keep referring to a Secret that
# does not exist, with no error to read.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
secretGenerator:
  - name: temporal-cloud-client
    namespace: temporal-proxy
    files:
      - tls.crt=certs/client.pem
      - tls.key=certs/client.key
